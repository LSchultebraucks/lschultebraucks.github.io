<!doctype html>
<html lang="en">

{% include head.html %}

<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <div class="container">
    {% include header.html %}

    <main id="main" class="post-container">
      {{ content }}
    </main>

    {% include footer.html %}

  </div>

  <script>
    // Theme toggle
    (function() {
      function applyState(btn) {
        var isDark = document.documentElement.classList.contains('theme-dark');
        btn.setAttribute('aria-pressed', isDark ? 'true' : 'false');
        btn.title = isDark ? 'Switch to light theme' : 'Switch to dark theme';
      }

      document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;

        applyState(btn);

        btn.addEventListener('click', function() {
          var root = document.documentElement;
          var next = root.classList.contains('theme-dark') ? 'light' : 'dark';

          btn.classList.add('changing');
          root.classList.remove('theme-dark', 'theme-light');
          root.classList.add(next === 'dark' ? 'theme-dark' : 'theme-light');
          try { localStorage.setItem('theme', next); } catch (e) {}
          applyState(btn);
          setTimeout(function() { btn.classList.remove('changing'); }, 300);
        });
      });
    })();

    // Reveal-on-scroll for post listings
    (function() {
      if (!('IntersectionObserver' in window)) return;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('animate-in');
          observer.unobserve(entry.target);
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

      document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.post-item, .posts h1, .post-container > *').forEach(function(el) {
          el.classList.add('animate-on-scroll');
          observer.observe(el);
        });
      });
    })();
  </script>

</body>
</html>
