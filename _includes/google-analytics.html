{%- comment -%}
  Only rendered when a GA4 measurement ID is configured in _data/settings.yml.
  With an empty ID nothing is emitted — no script tag, no external request.
{%- endcomment -%}
{%- assign ga_id = site.data.settings['google-ID'] -%}
{%- if ga_id and ga_id != '' -%}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ ga_id }}');
</script>
{%- endif -%}
