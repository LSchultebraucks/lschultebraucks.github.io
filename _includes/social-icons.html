{% for item in site.data.settings.social %}
  {% assign first_char = item.link | slice: 0 %}
  {% if first_char == '/' %}
    <a href="{{ item.link | relative_url }}" aria-label="{{ item.name | default: item.icon }}">{% include icon.html name=item.icon %}</a>
  {% else %}
    <a href="{{ item.link }}" target="_blank" rel="noopener noreferrer" aria-label="{{ item.name | default: item.icon }}">{% include icon.html name=item.icon %}</a>
  {% endif %}
{% endfor %}
