# Site Build Settings

# Canonical site URL. Required by jekyll-seo-tag for correct canonical/og tags,
# by jekyll-sitemap for absolute sitemap entries and by jekyll-feed.
url:         "https://lasseschultebraucks.com"
baseurl:     ""

# Build settings
markdown:    kramdown
highlighter: rouge
# permalink: none => /:categories/:title.html
# Changing this (or a post's categories) changes live URLs — don't.
permalink:   none
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

title:       "Lasse Schultebraucks"
description: "Senior IT Consultant"
author:      "Lasse Schultebraucks"

# Default social sharing image (og:image / twitter:image) for jekyll-seo-tag
image:       "/assets/img/lasse.jpg"

twitter:
  card: summary_large_image

social:
  name: "Lasse Schultebraucks"
  links:
    - https://github.com/LSchultebraucks
    - https://www.linkedin.com/in/lasse-schultebraucks-407b54175/
    - https://www.xing.com/profile/Lasse_Schultebraucks/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
